# H2 In-Memory Database Configuration for Development
spring.application.name=cloudsphere
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:mem:cloudsphere;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Disable Flyway (let JPA create schema)
spring.flyway.enabled=false

# Disable Redis
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# Logging
logging.level.root=INFO
logging.level.rw.ac.rca.cloudsphere=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Jackson
spring.jackson.default-property-inclusion=non_null

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operations-sorter=method

# App Configuration
cloudsphere.jwt.secret=cloudsphere-dev-only-change-me-to-a-64-char-secret-key!!
cloudsphere.jwt.issuer=cloudsphere
cloudsphere.jwt.ttl=PT8H
cloudsphere.lockout.max-attempts=5
cloudsphere.lockout.duration=PT30M
cloudsphere.payment.stub-mode=SUCCESS
cloudsphere.cors.allowed-origins=http://localhost:3000,http://localhost:5173
cloudsphere.seed.enabled=true
